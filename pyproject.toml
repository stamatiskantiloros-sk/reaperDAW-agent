[project]
name = "reaper-agent"
version = "0.0.0"
description = "MCP server that tidies REAPER projects and writes section-based FX automation"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest", "ruff", "lupa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs REAPER running with the bridge loaded"]

[tool.ruff]
line-length = 100
target-version = "py310"
